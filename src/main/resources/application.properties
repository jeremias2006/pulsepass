# Configuración principal de la aplicación (se lee al arrancar). La sintaxis ${VARIABLE:valor} significa:
# "usa la variable de entorno VARIABLE; si no existe, usa valor". Sin ':valor' la variable es OBLIGATORIA.
# Los comentarios van en líneas propias: en un .properties, un comentario al final de la línea se volvería parte del valor.

# Nombre lógico de la aplicación.
spring.application.name=pulsepass

# --- Base de datos: PostgreSQL local (puerto 5432, base "pulsepass") con las credenciales por defecto de desarrollo.
# Son valores solo para uso local: en un entorno real no se dejan en el repositorio.
spring.datasource.url=jdbc:postgresql://localhost:5432/pulsepass
spring.datasource.username=postgres
spring.datasource.password=postgres

# --- JPA / Hibernate ---
# open-in-view=false: la sesión de la base se cierra al terminar el servicio (no se mantiene abierta durante el
# controlador). Por eso las relaciones LAZY solo se pueden leer dentro de métodos @Transactional, y los mappers
# se invocan desde los servicios.
spring.jpa.open-in-view=false
# ddl-auto=validate: Hibernate NO crea ni modifica tablas; solo comprueba al arrancar que las entidades coincidan con el
# esquema. El esquema lo crea Flyway. Si no coinciden, la aplicación no arranca.
spring.jpa.hibernate.ddl-auto=validate
# Muestra en consola el SQL que genera Hibernate (con formato legible). Útil para aprender y depurar; en producción
# normalmente se desactiva.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway: ejecuta al arrancar las migraciones pendientes de db/migration (V1, V2, V3...) en orden y registra cuáles
# ya se aplicaron. Una migración aplicada no se edita nunca (cambiaría su checksum y Flyway se negaría a arrancar):
# los cambios nuevos van en una migración nueva.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT (se enlazan con la clase JwtProperties) ---
# issuer: quién emite los tokens; opcional, por defecto "pulsepass-api".
pulsepass.security.jwt.issuer=${PULSEPASS_JWT_ISSUER:pulsepass-api}
# secret-base64: clave secreta de firma en Base64 (al menos 32 bytes). NO tiene valor por defecto a propósito: sin la
# variable PULSEPASS_JWT_SECRET_BASE64 la aplicación no arranca, así nunca se firma con una clave conocida.
pulsepass.security.jwt.secret-base64=${PULSEPASS_JWT_SECRET_BASE64}
# access-token-ttl: vigencia del token. Formato de duración ISO-8601: PT15M = 15 minutos.
pulsepass.security.jwt.access-token-ttl=PT15M

# --- CORS: orígenes de navegador autorizados a llamar a la API, separados por comas. Vacío = ninguno.
pulsepass.security.cors.allowed-origins=${PULSEPASS_CORS_ORIGINS:}

# --- Logging: cada línea de log muestra el nivel (alineado a 5 caracteres) y el requestId que asigna RequestIdFilter.
# ":-" es el valor por defecto: fuera de una petición HTTP el requestId queda vacío.
logging.pattern.level=%5p [%X{requestId:-}]

# --- Cuentas semilla (solo con el perfil "local", ver LocalAccountsSeeder): contraseñas de admin y laura.
# Vacías o de menos de 12 caracteres = esa cuenta no se crea.
pulsepass.bootstrap.admin-password=${PULSEPASS_BOOTSTRAP_ADMIN_PASSWORD:}
pulsepass.bootstrap.staff-password=${PULSEPASS_BOOTSTRAP_STAFF_PASSWORD:}
