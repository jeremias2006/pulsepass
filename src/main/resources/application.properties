spring.application.name=pulsepass

spring.datasource.url=jdbc:postgresql://localhost:5432/pulsepass
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

pulsepass.security.jwt.issuer=${PULSEPASS_JWT_ISSUER:pulsepass-api}
pulsepass.security.jwt.secret-base64=${PULSEPASS_JWT_SECRET_BASE64}
pulsepass.security.jwt.access-token-ttl=PT15M

pulsepass.security.cors.allowed-origins=${PULSEPASS_CORS_ORIGINS:}

logging.pattern.level=%5p [%X{requestId:-}]

pulsepass.bootstrap.admin-password=${PULSEPASS_BOOTSTRAP_ADMIN_PASSWORD:}
pulsepass.bootstrap.staff-password=${PULSEPASS_BOOTSTRAP_STAFF_PASSWORD:}
