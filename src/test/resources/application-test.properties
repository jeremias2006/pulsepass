# Propiedades que se suman o sobrescriben a application.properties cuando una prueba activa el perfil "test"
# (con @ActiveProfiles("test")). Así las pruebas no dependen de variables de entorno.
# El secreto de abajo es SOLO para pruebas (es la frase "test-only-secret-key-32-bytes!!!" en Base64: justo 32 bytes,
# el mínimo que acepta JwtService). Nunca debe usarse fuera de las pruebas.
pulsepass.security.jwt.issuer=pulsepass-test
pulsepass.security.jwt.secret-base64=dGVzdC1vbmx5LXNlY3JldC1rZXktMzItYnl0ZXMhISE=
pulsepass.security.jwt.access-token-ttl=PT15M

